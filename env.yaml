name: mgap
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - trimmomatic
  - bwa
  - bedtools
  - samtools
  - picard
  - nextflow>=22.10.0    # UPDATED: Updated to a modern version where DSL2 is standard
  - bcftools
  - mummer
  - seqtk
  - pilon
  - spades=4.2.0
  - python               # Recommended: Nextflow sometimes relies on python for certain plugins
  - openjdk>=11
  - megahit
  - ragtag
  - fastp