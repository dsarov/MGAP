name: mgap
channels:
  - bioconda
  - conda-forge
  - defaults
dependencies:
  # General QC/Pre-processing
  - fastp
  - trimmomatic
  - seqtk
  
  # Contamination Screening Tools
  - kraken2            # Added Kraken2 for read-level contamination
  - checkm-genome   # Added NCBI FCS-GX for assembly-level contamination
  
  # Alignment/Mapping/Variant Calling
  - bwa
  - bedtools
  - samtools
  - picard
  - bcftools
  - mummer
  
  # Assembly and Polishers
  - spades=4.2.0
  - megahit
  - pilon
  - ragtag
  
  # Core Infrastructure / Nextflow Requirements
  - nextflow>=22.10.0
  - python                    # Essential for many bio-tools and scripts (e.g., FCS-GX)
  - openjdk>=11               # Needed for Picard, Pilon, and sometimes Nextflow executors