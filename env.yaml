name: mgap
channels:
  - bioconda
  - conda-forge
  - defaults
dependencies:
  # Core Language and Package Manager
  - python=3.9
  - pip

  # CheckM1 Conda Dependencies
  - numpy
  - matplotlib
  - pysam
  - hmmer
  - prodigal
  - pplacer

  # Pipeline Tools (Verified compatible with Python 3.9)
  - fastp
  - kraken2=2.1.2
  - spades=4.2.0
  - megahit
  - trimmomatic
  - bwa
  - samtools
  - picard
  - bcftools
  - mummer
  - seqtk
  - pilon
  - ragtag
  - openjdk>=11
  - nextflow>=22.10.0

  # Pip-specific installations
  - pip:
    - checkm-genome==1.2.2